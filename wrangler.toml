name = "atax"
main = "worker-dashboard.ts"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/mcp", "/socket", "/.well-known/*"]

# Production MCP database transport: Supabase Data API / PostgREST over HTTPS.
# Set ATAX_SUPABASE_URL and ATAX_SUPABASE_SECRET_KEY via `wrangler secret put`. Never in [vars].
