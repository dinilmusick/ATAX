name: Owner-authorized ULTRST signed-in OAuth E2E

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: >-
      github.event.issue.user.id == 155351357 &&
      github.event.issue.title == '[atax-auth] full-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Checkout public ATAX verification only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium on supported Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atax-auth-signedin
          npm install --prefix /tmp/atax-auth-signedin --no-audit --no-fund --ignore-scripts --save-exact playwright@1.57.0
          /tmp/atax-auth-signedin/node_modules/.bin/playwright install --with-deps chromium
          cp tools/github/verify_live_email_oauth_e2e.mjs /tmp/atax-auth-signedin/verify.mjs
      - name: Verify production email account, OAuth callback, persistence and logout
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/atax-auth-signedin/verify.mjs
      - name: Publish bounded non-secret E2E result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if test -f /tmp/atax-auth-signedin-report.txt; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/atax-auth-signedin-report.txt
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'Signed-in Chromium verification did not reach its assertions.'
          fi
