name: Owner-authorized ULTRST auth live smoke
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.id == 155351357 &&
       github.event.issue.title == '[atax-auth] live-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live public registration and app OAuth bootstrap
        shell: bash
        run: |
          set -euo pipefail
          LUTH='https://luth.blueprint-ninjastudios.workers.dev'
          AIKO='https://aiko.todadjp.workers.dev'
          SRKL='https://srkl-engine.todadjp.workers.dev'
          report=/tmp/auth-smoke-report.txt
          echo 'ULTRST Luth public auth production smoke' > "$report"
          failures=0
          status() {
            curl --proto '=https' --tlsv1.2 --silent --show-error \
              --connect-timeout 10 --max-time 22 \
              --output /dev/null --dump-header /tmp/auth-headers \
              --write-out '%{http_code}' "$1" || echo 000
          }
          health="$(status "$LUTH/api/status")"
          echo "Luth health HTTP: $health" >> "$report"
          [[ "$health" == 200 ]] || failures=$((failures+1))
          logs="$(status "$LUTH/api/logs")"
          echo "Unauthenticated login-log HTTP: $logs (expected 404)" >> "$report"
          [[ "$logs" == 404 ]] || failures=$((failures+1))
          discovery="$(status "$LUTH/api/auth/.well-known/openid-configuration")"
          echo "Official issuer discovery HTTP: $discovery" >> "$report"
          [[ "$discovery" == 200 ]] || failures=$((failures+1))
          dcr="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 22 -X POST \
            -H 'content-type: application/json' \
            --data '{"client_name":"invalid-test","redirect_uris":[],"token_endpoint_auth_method":"none"}' \
            --output /dev/null --write-out '%{http_code}' \
            "$LUTH/api/auth/oauth2/register" || echo 000)"
          echo "Invalid public DCR HTTP: $dcr (expected 400)" >> "$report"
          [[ "$dcr" == 400 ]] || failures=$((failures+1))
          for app in "$AIKO" "$SRKL"; do
            code="$(status "$app/api/auth/oidc/start")"
            header="$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="location:" {print $2}' /tmp/auth-headers | tr -d '\r' | tail -n 1)"
            valid_location=false
            if [[ "$header" == "$LUTH/api/auth/oauth2/authorize?"* ]]; then
              valid_location=true
            fi
            valid_pkce="$(AUTH_LOCATION="$header" APP_ORIGIN="$app" LUTH_ORIGIN="$LUTH" node - <<'NODE'
const raw = process.env.AUTH_LOCATION || '';
let ok = false;
try {
  const target = new URL(raw);
  const redirect = target.searchParams.get('redirect_uri');
  ok = target.origin === process.env.LUTH_ORIGIN
    && target.pathname === '/api/auth/oauth2/authorize'
    && target.searchParams.get('response_type') === 'code'
    && target.searchParams.get('code_challenge_method') === 'S256'
    && /^[A-Za-z0-9_-]{43}$/.test(target.searchParams.get('code_challenge') || '')
    && /^[A-Za-z0-9_-]{43}$/.test(target.searchParams.get('state') || '')
    && !!target.searchParams.get('client_id')
    && redirect === process.env.APP_ORIGIN + '/api/auth/oidc/callback';
} catch {}
process.stdout.write(ok ? 'true' : 'false');
NODE
)"
            secure_cookie=false
            if grep -Eiq '^set-cookie: .*httponly' /tmp/auth-headers &&
               grep -Eiq '^set-cookie: .*secure' /tmp/auth-headers &&
               grep -Eiq '^set-cookie: .*samesite=lax' /tmp/auth-headers; then
              secure_cookie=true
            fi
            echo "${app#https://} OAuth start HTTP: $code; official issuer redirect: $valid_location; PKCE S256: $valid_pkce; secure flow cookie: $secure_cookie" >> "$report"
            if [[ "$code" != 302 && "$code" != 303 ]] ||
               [[ "$valid_location" != true ]] ||
               [[ "$valid_pkce" != true ]] ||
               [[ "$secure_cookie" != true ]]; then
              failures=$((failures+1))
            fi
            session_code="$(status "$app/api/auth/oidc/session")"
            callback_code="$(status "$app/api/auth/oidc/callback")"
            echo "${app#https://} unauthenticated session HTTP: $session_code; invalid callback HTTP: $callback_code" >> "$report"
            [[ "$session_code" == 401 && "$callback_code" == 400 ]] || failures=$((failures+1))
          done
          echo "Failed smoke assertions: $failures" >> "$report"
          cat "$report"
          test "$failures" = 0

      - name: Publish bounded test result
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if test -f /tmp/auth-smoke-report.txt; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/auth-smoke-report.txt
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body 'Live auth probe did not execute.'
          fi
