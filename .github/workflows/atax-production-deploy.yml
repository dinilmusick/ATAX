name: Deploy ATAX production Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "supabase/migrations/**"
      - "worker-dashboard.ts"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "tools/atax-mcp/**"
      - ".github/workflows/atax-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atax-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATAX_SUPABASE_CONNECTION_URL: ${{ secrets.ATAX_SUPABASE_CONNECTION_URL }}
      ATAX_INSTANCE_PASSKEY: ${{ secrets.ATAX_INSTANCE_PASSKEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.ATAX_MCP_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source
        run: |
          npm run lint
          npm test
          npm run build
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml
      - name: Validate deployment secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATAX_SUPABASE_CONNECTION_URL" || { echo "Missing GitHub secret ATAX_SUPABASE_CONNECTION_URL"; exit 1; }
          test -n "$ATAX_INSTANCE_PASSKEY" || { echo "Missing GitHub secret ATAX_INSTANCE_PASSKEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret ATAX_MCP_CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Apply canonical Supabase migrations
        run: npx --yes supabase@3 db push --yes --remote="$ATAX_SUPABASE_CONNECTION_URL"
      - name: Bootstrap singleton instance passkey
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(printf '%s' "$ATAX_INSTANCE_PASSKEY" | base64 -w0)"
          cat > /tmp/atax-bootstrap.sql <<SQL
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM atax_private.instance_auth WHERE id = true) THEN
              PERFORM atax_private.initialize_instance_passkey_v1(
                convert_from(decode('$encoded','base64'),'utf8')
              );
            END IF;
          END
          $$;
          SQL
          npx --yes supabase@3 db query --yes --remote="$ATAX_SUPABASE_CONNECTION_URL" --file /tmp/atax-bootstrap.sql
          rm -f /tmp/atax-bootstrap.sql
          unset ATAX_INSTANCE_PASSKEY
      - name: Configure Worker database secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ATAX_SUPABASE_CONNECTION_URL" |
            npx --yes wrangler@4 secret put ATAX_SUPABASE_CONNECTION_URL --config wrangler.toml
      - name: Deploy production Worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 20 https://atax.dextro1n1laevo.workers.dev/health)"
          echo "$health"
          echo "$health" | grep -q '"version":"1.1.0"'
          echo "$health" | grep -q '"settings":{"routes":true,"authentication":"instance-passkey"}'
          status_code="$(curl --silent --output /tmp/atax-settings-status.json --write-out '%{http_code}' --max-time 20 https://atax.dextro1n1laevo.workers.dev/api/settings/status)"
          echo "settings status HTTP $status_code"
          cat /tmp/atax-settings-status.json
          test "$status_code" != "404"
          grep -q '"backend"' /tmp/atax-settings-status.json
          providers_code="$(curl --silent --output /tmp/atax-providers.json --write-out '%{http_code}' --max-time 20 https://atax.dextro1n1laevo.workers.dev/api/settings/providers)"
          echo "providers HTTP $providers_code"
          cat /tmp/atax-providers.json
          test "$providers_code" = "401"
