name: Private OIDC consumer repair and verification
on:
  push:
    paths: [.github/workflows/verify-unified-oidc-consumers-20261122.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/ops/unified-oidc-consumers-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Clone, repair frozen lockfiles, push exact changes, run private tests
        env:
          PRIVATE_REPO_TOKEN: \${{ secrets.PRIVATE_REPO_TOKEN }}
          CODING_REPO_TOKEN: \${{ secrets.CODING_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          umask 077
          mkdir -p /tmp/oidc-verify
          cat >/tmp/oidc-verify/askpass <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf x-access-token ;;
            *Password*) printf %s "$GIT_AUTH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 /tmp/oidc-verify/askpass
          export GIT_ASKPASS=/tmp/oidc-verify/askpass GIT_TERMINAL_PROMPT=0
          for repo in Kone Brwlr-Engine; do
            export GIT_AUTH_TOKEN="$PRIVATE_REPO_TOKEN"
            if ! git -c credential.helper= clone --quiet --depth 1 \
              --branch feat/unified-oidc-skipo-20261122 \
              "https://github.com/dinilmusick/$repo.git" "/tmp/oidc-verify/$repo" \
              >/tmp/oidc-verify/clone.log 2>&1; then
              if [ -n "$CODING_REPO_TOKEN" ]; then
                export GIT_AUTH_TOKEN="$CODING_REPO_TOKEN"
                git -c credential.helper= clone --quiet --depth 1 \
                  --branch feat/unified-oidc-skipo-20261122 \
                  "https://github.com/dinilmusick/$repo.git" "/tmp/oidc-verify/$repo" \
                  >/tmp/oidc-verify/clone-write-token.log 2>&1 || {
                  if grep -qi 'Repository not found' /tmp/oidc-verify/clone-write-token.log;then
                    echo "PRIVATE_REPO_TOKEN_SCOPE_DENIED=$repo"
                  else echo "PRIVATE_CLONE_FAILURE=$repo"; fi
                  exit 128
                }
              else echo "PRIVATE_CLONE_FAILURE=$repo"; exit 128
              fi
            fi
            cd "/tmp/oidc-verify/$repo"
            test "$(git branch --show-current)" = "feat/unified-oidc-skipo-20261122"
            echo "PRIVATE_CLONE_VERIFIED=$repo"
            set +e
            if [ "$repo" = Kone ]; then
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
                >/tmp/oidc-verify/Kone.lock.log 2>&1
              lockcode=$?;lockfile=package-lock.json
            else
              pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile \
                >/tmp/oidc-verify/Brwlr-Engine.lock.log 2>&1
              lockcode=$?;lockfile=pnpm-lock.yaml
            fi
            set -e
            if [ "$lockcode" -eq 0 ] && ! git diff --quiet -- "$lockfile"; then
              git config user.name 'ATAX verified isolated dependency updater'
              git config user.email '155351357+dinilmusick@users.noreply.github.com'
              git add "$lockfile"
              git commit -qm 'chore(auth): update exact published OAuth dependency lock'
              if [ -n "$CODING_REPO_TOKEN" ]; then
                export GIT_AUTH_TOKEN="$CODING_REPO_TOKEN"
              fi
              git -c credential.helper= push -q origin HEAD:feat/unified-oidc-skipo-20261122 \
                >/tmp/oidc-verify/push.log 2>&1
              export GIT_AUTH_TOKEN="$PRIVATE_REPO_TOKEN"
            fi
            set +e
            installcode=99; typecode=99; testcode=99; buildcode=99
            if [ "$lockcode" -eq 0 ];then
              if [ "$repo" = Kone ]; then
                npm ci --ignore-scripts --no-audit --no-fund >/tmp/oidc-verify/Kone.install.log 2>&1
                installcode=$?
                if [ "$installcode" -eq 0 ];then
                  npm run typecheck >/tmp/oidc-verify/Kone.typecheck.log 2>&1;typecode=$?
                  npm run test >/tmp/oidc-verify/Kone.test.log 2>&1;testcode=$?
                  npm run build >/tmp/oidc-verify/Kone.build.log 2>&1;buildcode=$?
                fi
              else
                pnpm install --frozen-lockfile --ignore-scripts >/tmp/oidc-verify/Brwlr-Engine.install.log 2>&1
                installcode=$?
                if [ "$installcode" -eq 0 ];then
                  pnpm exec tsc --noEmit >/tmp/oidc-verify/Brwlr-Engine.typecheck.log 2>&1;typecode=$?
                  pnpm run test >/tmp/oidc-verify/Brwlr-Engine.test.log 2>&1;testcode=$?
                  pnpm run build >/tmp/oidc-verify/Brwlr-Engine.build.log 2>&1;buildcode=$?
                fi
              fi
            fi
            set -e
            printf 'lock=%s\ninstall=%s\ntypecheck=%s\ntest=%s\nbuild=%s\n' \
              "$lockcode" "$installcode" "$typecode" "$testcode" "$buildcode" \
              >/tmp/oidc-verify/$repo.status
            echo "PRIVATE_SUITE_STATUS=$repo lock:$lockcode install:$installcode type:$typecode test:$testcode build:$buildcode"
          done
      - name: Comment sanitized errors only on private PRs
        if: always()
        env:
          GH_TOKEN: \${{ secrets.CODING_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then exit 0; fi
          python3 - <<'PY'
          import pathlib,re,json
          root=pathlib.Path('/tmp/oidc-verify')
          for repo in ['Kone','Brwlr-Engine']:
            if not (root/repo).exists():continue
            statuses=(root/(repo+'.status')).read_text() if (root/(repo+'.status')).exists() else 'Not finished'
            errors=[]
            for stage in ['lock','install','typecheck','test','build']:
              p=root/(repo+'.'+stage+'.log')
              if not p.exists():continue
              for line in p.read_text(errors='replace').splitlines():
                if not re.search(r'(error TS\d+|^Error:|AssertionError|FAIL|not ok|ERR_PNPM|ERR!|Cannot find module|Could not resolve|Cannot find name|does not exist)',line,re.I):continue
                line=re.sub(r'(?:https?://|postgres(?:ql)?://)\S+','[url]',line)
                line=re.sub(r'[^\s]+@[^\s]+','[email]',line)
                line=re.sub(r'[0-9a-fA-F]{32,}','[opaque-id]',line)
                line=re.sub(r'/tmp/oidc-verify/'+repo,'[private-clone]',line)
                line=re.sub(r'(?:token|secret|password|authorization)\s*[:=]\s*\S+','[credential]',line,flags=re.I)
                errors.append(stage+': '+line[:250])
            body='ATAX isolated authentication upgrade verification.\n'+statuses+'\nFiltered diagnostics:\n'+'\n'.join(errors[:110])+'\nPrivate source and raw logs deleted after run.'
            (root/(repo+'.comment.json')).write_text(json.dumps({'body':body}))
          PY
          for repo in Kone Brwlr-Engine; do
            test -f "/tmp/oidc-verify/$repo.comment.json" || continue
            if [ "$repo" = Kone ]; then pr=41; else pr=3; fi
            gh api -X POST "repos/dinilmusick/$repo/issues/$pr/comments" \
              --input "/tmp/oidc-verify/$repo.comment.json" >/dev/null
          done
      - name: Delete all transient private material
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/oidc-verify
          test ! -e /tmp/oidc-verify
          echo CLEANUP_VERIFIED
