name: ATAX MCP gateway tests

on:
  pull_request:
    paths:
      - 'tools/atax-mcp/**'
      - '.github/workflows/atax-mcp-tests.yml'
      - '.github/workflows/private-repo-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/atax-mcp/**'
      - '.github/workflows/atax-mcp-tests.yml'
      - '.github/workflows/private-repo-ci.yml'

permissions:
  contents: read

jobs:
  stateless-mcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify zero-dependency MCP package (Data API only)
        run: |
          test ! -d tools/atax-mcp/node_modules/postgres
          npm install --prefix tools/atax-mcp --ignore-scripts --no-audit --no-fund
      - name: Syntax, unit, and E2E Data API contract tests (ATAX gateway only)
        run: |
          node --check tools/atax-mcp/data-api-ledger.mjs
          node --check tools/atax-mcp/ledger-config.mjs
          node --check tools/atax-mcp/worker.mjs
          node --check tools/atax-mcp/github-tools.mjs
          node --check tools/atax-mcp/provider-accounts.mjs
          node --test tools/atax-mcp/*.test.mjs
          node tests/e2e-data-api/run-all.mjs

      - name: Independent live Cloudflare health, Data API transport, and fail-closed probe
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'dinilmusick/ATAX')
        env:
          HEALTH_URL: https://atax.dextro1n1laevo.workers.dev/health
          MCP_URL: https://atax.dextro1n1laevo.workers.dev/mcp
        run: |
          set -euo pipefail
          health_body="$(curl --fail --silent --show-error --retry 3 --max-time 20 "$HEALTH_URL")"
          echo "$health_body" | grep -F '"status":"ok"'
          echo "$health_body" | grep -F '"databaseTransport":"supabase-data-api"'
          code="$(curl --silent --show-error --max-time 20 -o /tmp/atax-mcp-unauth.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-probe","version":"1"}}}' "$MCP_URL")"
          echo "Unauthenticated MCP initialize observed HTTP $code (expected 401 or 503)"
          if [ "$code" != "503" ] && [ "$code" != "401" ]; then
            echo "Expected auth/config failure, got HTTP $code" >&2; cat /tmp/atax-mcp-unauth.json >&2; exit 1
          fi
      - name: Independent Socket V1 standalone conformance (synthetic; not live certification)
        run: |
          set -euo pipefail
          node --test tests/task-socket-conformance/*.test.mjs tools/socket-budget/index.test.mjs
          node tests/task-socket-conformance/calibration-cli.mjs > /tmp/atax-socket-calibration.json
          node -e "const a=require('/tmp/atax-socket-calibration.json'); if (!a.rows?.length || a.rows.some(r=>r.status!=='NOT_CALIBRATED')) process.exit(1)"

      - name: Cloudflare Worker packaging dry-run
        run: npx --yes wrangler@4 deploy --dry-run --config tools/atax-mcp/wrangler.toml --outdir /tmp/atax-mcp-dry-run

      - name: Restricted Socket Worker syntax and deployment bundle dry-run
        run: |
          set -euo pipefail
          node --check tools/atax-mcp/socket-worker.mjs
          node --check tools/socket-budget/index.mjs
          npx --yes wrangler@4 deploy --dry-run --config tools/atax-mcp/wrangler.socket.toml --outdir /tmp/atax-socket-dry-run
          test -n "$(find /tmp/atax-socket-dry-run -type f -name '*.js' -print -quit)"
