name: Create Plain GitHub Repository
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name
        required: true
        type: string
      visibility:
        description: Repository visibility
        required: true
        default: private
        type: choice
        options: [private, public]
      description:
        description: Repository description
        required: false
        type: string
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  create:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.author_association == 'OWNER' &&
       startsWith(github.event.issue.title, '[create-repo] '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re
          if os.environ['EVENT_NAME']=='issues':
              payload=json.loads(os.environ['ISSUE_BODY'])
              assert isinstance(payload,dict) and set(payload)=={'repository','visibility','description'}, 'Invalid keys'
              assert os.environ['ISSUE_TITLE']=='[create-repo] '+payload['repository'], 'Title mismatch'
              name,visibility,description=(payload[k] for k in ('repository','visibility','description'))
          else:
              name=os.environ['INPUT_REPOSITORY']
              visibility=os.environ['INPUT_VISIBILITY']
              description=os.environ['INPUT_DESCRIPTION']
          assert isinstance(name,str) and re.fullmatch(r'[A-Za-z0-9._-]{1,100}',name), 'Invalid name'
          assert visibility in ('private','public'), 'Invalid visibility'
          assert isinstance(description,str) and len(description)<=300, 'Invalid description'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('repository='+name+'\nvisibility='+visibility+'\n')
          with open('repository-description.txt','w') as f:
              f.write(description)
          PY
      - name: Create plain repository (no scaffold)
        env:
          GITHUB_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          REPOSITORY: ${{ steps.request.outputs.repository }}
          VISIBILITY: ${{ steps.request.outputs.visibility }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GITHUB_TOKEN" ]] || { echo 'Missing CODING_REPO_TOKEN'; exit 1; }
          bash tools/github/create-repository.sh "$REPOSITORY" "$VISIBILITY" "$(cat repository-description.txt)" > repository-result.txt
      - name: Independently verify existence and visibility
        env:
          GITHUB_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          REPOSITORY: ${{ steps.request.outputs.repository }}
          VISIBILITY: ${{ steps.request.outputs.visibility }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/dinilmusick/'+os.environ['REPOSITORY'],
            headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as res: data=json.load(res)
          assert data['full_name'].lower()==('dinilmusick/'+os.environ['REPOSITORY']).lower()
          assert data['visibility']==os.environ['VISIBILITY'], 'Repository visibility mismatch'
          print('Verified:',data['html_url'],'visibility:',data['visibility'])
          PY
      - name: Report outcome on issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Plain repository creation: $STATUS. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
