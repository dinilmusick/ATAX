name: Verify Skiplet template creation
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  verify:
    if: >-
      github.event.issue.title == '[skiplet-template] verify' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify template generation and cleanup
        id: verify
        env:
          CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,uuid,time
          token=os.environ.get('CODING_REPO_TOKEN')
          if not token: raise SystemExit('BLOCKED: CODING_REPO_TOKEN missing')
          def api(path,method='GET',data=None):
              req=urllib.request.Request('https://api.github.com'+path,
                  data=None if data is None else json.dumps(data).encode(),method=method,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28','User-Agent':'atax-skiplet-verify'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      return json.load(response) if response.status!=204 else {}
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f'GitHub {method} {path}: HTTP {exc.code}') from None
          source=api('/repos/dinilmusick/Skiplet')
          assert source.get('is_template') is True,'FAIL: is_template is not true'
          name='MDT-Skiplet-Verification-'+uuid.uuid4().hex[:10]
          path='/repos/dinilmusick/'+name
          created=False
          try:
              result=api('/repos/dinilmusick/Skiplet/generate','POST',
                  {'owner':'dinilmusick','name':name,'private':False,'include_all_branches':False})
              created=True
              assert result['name']==name
              manifest=None
              for attempt in range(15):
                  try:
                      manifest=api(path+'/contents/meditations.config.json')
                      break
                  except RuntimeError as exc:
                      if 'HTTP 404' not in str(exc): raise
                      time.sleep(2)
              assert manifest and manifest.get('type')=='file','FAIL: generated template missing config after 30s'
              print('PASS: template flag and generated configuration')
          finally:
              if created:
                  api(path,'DELETE')
                  print('PASS: disposable repository deleted')
          PY
      - name: Report outcome to verification issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RESULT: ${{ steps.verify.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Skiplet verification result: **%s**\n\nRun: %s\n\nInspect the run logs for template flag, generated config, and cleanup evidence.\n' "$RESULT" "$RUN_URL" > /tmp/skiplet-result.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/skiplet-result.md
