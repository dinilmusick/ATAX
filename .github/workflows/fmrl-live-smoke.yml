# Verification pass 2: nested output retained only in runner-local temp file.
name: Disposable FMRL live smoke (CI branch only)
on:
  push:
    branches: [ci/fmrl-dispatch-auth-diagnostics-20261118]
    paths: [.github/workflows/fmrl-live-smoke.yml]
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Luth
            repository: dinilmusick/Luth
            ref: 253469c3e0f7f75b419a17b53314cf7e9f43f488
            workflow: ci.yml
          - name: Aiko
            repository: dinilmusick/Aiko
            ref: d8ab9d44aefe29d70a0ac0b47cd6524872e5b737
            workflow: validate.yml
    steps:
      - name: Checkout ATAX controller tooling only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision, run and independently delete one disposable FMRL
        shell: bash
        env:
          CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          FMRL_SECRETS_TOKEN: ${{ secrets.FMRL_SECRETS_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_SHA: ${{ matrix.ref }}
          TARGET_WORKFLOW: ${{ matrix.workflow }}
        run: |
          set -euo pipefail
          : "${CODING_REPO_TOKEN:?Missing provisioning token}"
          : "${FMRL_SECRETS_TOKEN:?Missing secret-writing token}"
          : "${PRIVATE_REPO_TOKEN:?Missing clone-only token}"
          trap 'result=$?; trap - EXIT; if [[ -s /tmp/fmrl-smoke.json ]]; then bridge="$(python3 -c '\''import json;print(json.load(open("/tmp/fmrl-smoke.json"))["disposable_repository"])'\'')"; GITHUB_TOKEN="$CODING_REPO_TOKEN" python3 tools/github/repository_lifecycle.py delete --repository "$bridge" || result=1; status="$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "https://api.github.com/repos/$bridge" || true)"; echo "FMRL independently queried after delete: $status"; [[ "$status" == 404 ]] || result=1; fi; exit "$result"' EXIT
          python3 tools/github/disposable_workspace.py \
            --source "$TARGET_REPOSITORY" \
            --target "FMRL-smoke-${GITHUB_RUN_ID}-${{ matrix.name }}" \
            --ref "$TARGET_SHA" \
            --event pull_request \
            --workflow "$TARGET_WORKFLOW" > /tmp/fmrl-smoke.json
          bridge="$(python3 -c 'import json;print(json.load(open("/tmp/fmrl-smoke.json"))["disposable_repository"])')"
          [[ "$bridge" =~ ^[A-Za-z0-9_.-]+/FMRL-[A-Za-z0-9-]+$ ]]
          echo "FMRL provisioned: $bridge"
          registered=0
          for i in $(seq 1 12); do
            if curl -fsS --connect-timeout 10 --max-time 20 \
              "https://api.github.com/repos/$bridge/actions/workflows/atax-private-ci.yml" >/dev/null 2>&1; then
              registered=1
              break
            fi
            sleep 5
          done
          [[ "$registered" == 1 ]] || { echo "Bridge workflow registration absent" >&2; exit 1; }
          marker="$(printf 'approved FMRL execution\n' | base64 | tr -d '\n')"
          GH_TOKEN="$CODING_REPO_TOKEN" gh api -X PUT \
            "repos/$bridge/contents/.fmrl/execute" \
            -f message="ci: run disposable FMRL smoke" \
            -f content="$marker" -f branch=main >/dev/null
          echo "One-shot PAT-backed push initiated; waiting for FMRL result."
          completed=0
          for i in $(seq 1 80); do
            response="$(curl -fsS --connect-timeout 10 --max-time 20 \
              "https://api.github.com/repos/$bridge/actions/workflows/atax-private-ci.yml/runs?per_page=5" || true)"
            result="$(printf '%s' "$response" | jq -r '.workflow_runs[0] | [.id,.status,.conclusion,.html_url] | @tsv' 2>/dev/null || true)"
            if [[ -n "$result" && "$result" != null ]]; then
              IFS=$'\t' read -r run_id status conclusion run_url <<< "$result"
              if [[ "$status" == completed ]]; then
                completed=1
                echo "FMRL run $run_id concluded: $conclusion"
                echo "FMRL run $run_url; conclusion: $conclusion" >> "$GITHUB_STEP_SUMMARY"
                jobs="$(curl -fsS --connect-timeout 10 --max-time 20 \
                  "https://api.github.com/repos/$bridge/actions/runs/$run_id/jobs?per_page=50" || true)"
                printf '%s' "$jobs" | jq -r '.jobs[]? | "Job: \(.name) - \(.conclusion)", (.steps[]? | select(.conclusion != "success") | "Step: \(.name) - \(.conclusion)")' || true
                [[ "$conclusion" == success ]] || exit 1
                break
              fi
            fi
            sleep 30
          done
          [[ "$completed" == 1 ]] || { echo "FMRL smoke timed out without completed execution" >&2; exit 1; }
