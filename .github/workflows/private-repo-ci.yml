name: FMRL CI controller (no target code in ATAX)
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Private owner/name
        required: true
        type: string
      ref:
        description: Target branch/tag
        required: false
        default: ""
        type: string
      event:
        description: Target event
        required: false
        default: push
        type: string
      workflow:
        description: Optional target workflow filename
        required: false
        default: ""
        type: string
      skipo_action:
        description: Optional pinned Skipo command, executed inside FMRL
        required: false
        default: ""
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  fmrl:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.title, '[fmrl-ci]') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ATAX orchestration scripts only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve and validate request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_EVENT: ${{ inputs.event }}
          INPUT_WORKFLOW: ${{ inputs.workflow }}
          INPUT_SKIPO_ACTION: ${{ inputs.skipo_action }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re
          data = json.loads(os.environ.get('ISSUE_BODY') or '{}') if os.environ['EVENT_NAME']=='issues' else {
            'repository':os.environ.get('INPUT_REPOSITORY',''),
            'ref':os.environ.get('INPUT_REF',''),
            'event':os.environ.get('INPUT_EVENT','push'),
            'workflow':os.environ.get('INPUT_WORKFLOW',''),
            'skipo_action':os.environ.get('INPUT_SKIPO_ACTION','')
          }
          repo=data.get('repository') or ''
          ref=data.get('ref') or ''
          event=data.get('event') or 'push'
          workflow=data.get('workflow') or ''
          skipo_action=data.get('skipo_action') or ''
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)
          assert re.fullmatch(r'[A-Za-z0-9_./-]*',ref)
          assert event in ('push','pull_request','workflow_dispatch')
          assert not workflow or re.fullmatch(r'[A-Za-z0-9_.-]+\.ya?ml',workflow)
          assert skipo_action in ('','inspect','diagnose','plan','verify','test','update','repair','sync')
          assert not (skipo_action and workflow)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for key,val in [('repository',repo),('ref',ref),('event',event),('workflow',workflow),('skipo_action',skipo_action)]:
              print(key+'='+val,file=out)
          PY

      - name: Provision disposable FMRL public repository
        id: bridge
        env:
          CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          FMRL_SECRETS_TOKEN: ${{ secrets.FMRL_SECRETS_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TARGET: ${{ steps.request.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/github/disposable_workspace.py --source "$TARGET" \
            --target "FMRL-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /tmp/fmrl.json
          bridge="$(python3 -c 'import json;print(json.load(open("/tmp/fmrl.json"))["disposable_repository"])')"
          [[ "$bridge" =~ ^[A-Za-z0-9_.-]+/FMRL-[A-Za-z0-9-]+$ ]]
          echo "repository=$bridge" >> "$GITHUB_OUTPUT"
          echo "Provisioned disposable bridge: $bridge" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch FMRL runner and independently inspect result
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          BRIDGE: ${{ steps.bridge.outputs.repository }}
          SOURCE: ${{ steps.request.outputs.repository }}
          REQUESTED_REF: ${{ steps.request.outputs.ref }}
          EVENT: ${{ steps.request.outputs.event }}
          WORKFLOW: ${{ steps.request.outputs.workflow }}
          SKIPO_ACTION: ${{ steps.request.outputs.skipo_action }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          if [[ -z "$ref" ]]; then
            ref="$(python3 -c 'import json;print(json.load(open("/tmp/fmrl.json"))["default_ref"])')"
          fi
          for i in $(seq 1 12); do
            if gh api -X POST "repos/$BRIDGE/actions/workflows/atax-private-ci.yml/dispatches" \
              -f ref=main -f "inputs[repository]=$SOURCE" -f "inputs[ref]=$ref" \
              -f "inputs[event]=$EVENT" -f "inputs[workflow]=$WORKFLOW" \
              -f "inputs[skipo_action]=$SKIPO_ACTION" >/dev/null 2>&1; then
              break
            fi
            [[ "$i" == 12 ]] && { echo "FMRL dispatch failed" >&2; exit 1; }
            sleep 5
          done
          completed=0
          for i in $(seq 1 105); do
            result="$(gh api "repos/$BRIDGE/actions/workflows/atax-private-ci.yml/runs" \
              --jq '.workflow_runs[0] | [.id,.status,.conclusion,.html_url] | @tsv' 2>/dev/null || true)"
            if [[ -n "$result" && "$result" != null ]]; then
              IFS=$'\t' read -r run_id status conclusion url <<< "$result"
              if [[ "$status" == completed ]]; then
                completed=1
                echo "FMRL run: $url; conclusion: $conclusion" >> "$GITHUB_STEP_SUMMARY"
                # Preserve failure step names before the disposable repository is deleted.
                # Do not retain private-source artifacts or raw logs.
                gh api "repos/$BRIDGE/actions/runs/$run_id/jobs?per_page=100" \
                  --jq '.jobs[] | "Job: " + .name + " (" + (.conclusion // .status) + ")", (.steps[]? | select(.conclusion == "failure") | "Failed step: " + .name)' \
                  >> "$GITHUB_STEP_SUMMARY" || echo "FMRL job-step detail unavailable." >> "$GITHUB_STEP_SUMMARY"
                [[ "$conclusion" == success ]] || exit 1
                break
              fi
            fi
            sleep 25
          done
          [[ "$completed" == 1 ]] || { echo "FMRL verification timed out" >&2; exit 1; }

      - name: ALWAYS delete FMRL and verify absence
        if: always() && steps.bridge.outputs.repository != ''
        env:
          GITHUB_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          BRIDGE: ${{ steps.bridge.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRIDGE" =~ ^[A-Za-z0-9_.-]+/FMRL-[A-Za-z0-9-]+$ ]]
          [[ "$BRIDGE" != dinilmusick/ATAX ]]
          python3 tools/github/repository_lifecycle.py delete --repository "$BRIDGE"
          echo "FMRL cleanup independently verified." >> "$GITHUB_STEP_SUMMARY"
