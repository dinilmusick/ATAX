name: FMRL CI controller (no target code in ATAX)
run-name: ATAX FMRL ${{ inputs.request_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Private owner/name
        required: true
        type: string
      ref:
        description: Exact target commit SHA (40 lowercase hexadecimal characters)
        required: true
        type: string
      event:
        description: Target event
        required: false
        default: push
        type: string
      workflow:
        description: Optional target workflow filename
        required: false
        default: ""
        type: string
      request_id:
        description: Opaque MCP correlation UUID (no private target data)
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string
      event:
        required: false
        default: push
        type: string
      workflow:
        required: false
        default: ""
        type: string
      mode:
        required: false
        default: direct
        type: string
      branch:
        required: false
        default: ""
        type: string
      request_id:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  fmrl:
    if: inputs.repository != '' && inputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ATAX orchestration scripts only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve and validate request
        id: request
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_EVENT: ${{ inputs.event }}
          INPUT_WORKFLOW: ${{ inputs.workflow }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re
          data = {
            'repository':os.environ.get('INPUT_REPOSITORY',''),
            'ref':os.environ.get('INPUT_REF',''),
            'event':os.environ.get('INPUT_EVENT','push'),
            'workflow':os.environ.get('INPUT_WORKFLOW',''),
            'mode':os.environ.get('INPUT_MODE','direct'),
            'branch':os.environ.get('INPUT_BRANCH',''),
            'request_id':os.environ.get('INPUT_REQUEST_ID','')
          }
          repo=data.get('repository') or ''
          ref=data.get('ref') or ''
          event=data.get('event') or 'push'
          workflow=data.get('workflow') or ''
          mode=data.get('mode') or 'direct'
          branch=data.get('branch') or ''
          request_id=data.get('request_id') or ''
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)
          assert re.fullmatch(r'[0-9a-f]{40}',ref)
          assert event in ('push','pull_request','workflow_dispatch')
          assert not workflow or re.fullmatch(r'[A-Za-z0-9_.-]+\.ya?ml',workflow)
          assert mode in ('direct','repair','artifact')
          assert not request_id or re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}',request_id)
          assert not branch or (re.fullmatch(r'[A-Za-z0-9_./-]{1,180}',branch) and '..' not in branch)
          assert mode != 'repair' or (repo in ('dinilmusick/Luth','dinilmusick/Srkl-Engine','dinilmusick/Aiko','dinilmusick/Frnes','dinilmusick/Embr') and branch)
          assert mode != 'artifact' or (repo in ('dinilmusick/Srkl-Engine','dinilmusick/Aiko') and branch)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for key,val in [('repository',repo),('ref',ref),('event',event),('workflow',workflow),('mode',mode),('branch',branch)]:
              print(key+'='+val,file=out)
          PY

      - name: Provision disposable FMRL public repository
        id: bridge
        env:
          CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          FMRL_SECRETS_TOKEN: ${{ secrets.FMRL_SECRETS_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TARGET: ${{ steps.request.outputs.repository }}
          TARGET_REF: ${{ steps.request.outputs.ref }}
          TARGET_EVENT: ${{ steps.request.outputs.event }}
          TARGET_WORKFLOW: ${{ steps.request.outputs.workflow }}
          TARGET_MODE: ${{ steps.request.outputs.mode }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/github/disposable_workspace.py --source "$TARGET" \
            --target "FMRL-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --ref "$TARGET_REF" --event "$TARGET_EVENT" --workflow "$TARGET_WORKFLOW" \
            --mode "$TARGET_MODE" --branch "$TARGET_BRANCH" > /tmp/fmrl.json
          bridge="$(python3 -c 'import json;print(json.load(open("/tmp/fmrl.json"))["disposable_repository"])')"
          [[ "$bridge" =~ ^[A-Za-z0-9_.-]+/FMRL-[A-Za-z0-9-]+$ ]]
          echo "repository=$bridge" >> "$GITHUB_OUTPUT"
          echo "Provisioned disposable bridge: $bridge" >> "$GITHUB_STEP_SUMMARY"
          echo "FMRL mode: ${TARGET_MODE} (exact private revision; no raw source logs or artifacts)." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch FMRL runner and independently inspect result
        env:
          GH_TOKEN: ${{ secrets.FMRL_DISPATCH_TOKEN || secrets.FMRL_SECRETS_TOKEN }}
          FMRL_CONTENTS_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          FMRL_LOGS_TOKEN: ${{ secrets.FMRL_SECRETS_TOKEN }}
          BRIDGE: ${{ steps.bridge.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched=0
          dispatch_error=""
          for i in $(seq 1 12); do
            if dispatch_error="$(gh api -X POST "repos/$BRIDGE/actions/workflows/atax-private-ci.yml/dispatches" -f ref=main 2>&1 >/dev/null)"; then
              dispatched=1
              break
            fi
            if [[ "$dispatch_error" == *"Resource not accessible by personal access token"* ]]; then
              # Workflow dispatch requires Actions: write, while bridge provisioning
              # already has Contents: write. A personal-token push on this exact
              # marker can trigger the FMRL workflow without expanding secret scope.
              # Target identity/ref/event are encrypted as disposable Actions secrets.
              # The static committed workflow and one-shot marker contain no private metadata.
              echo "FMRL workflow_dispatch denied (HTTP 403); using one-shot Contents:write push trigger." >> "$GITHUB_STEP_SUMMARY"
              registered=0
              for ready in $(seq 1 12); do
                if curl -fsS --connect-timeout 10 --max-time 20 -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$BRIDGE/actions/workflows/atax-private-ci.yml" >/dev/null 2>&1; then
                  registered=1
                  break
                fi
                sleep 5
              done
              [[ "$registered" == 1 ]] || { echo "FMRL push fallback refused: bridge workflow registration unconfirmed" >&2; exit 1; }
              marker="$(printf 'approved FMRL execution\n' | base64 | tr -d '\n')"
              GH_TOKEN="$FMRL_CONTENTS_TOKEN" gh api -X PUT "repos/$BRIDGE/contents/.fmrl/execute" \
                -f message="ci: start one-shot disposable verification" \
                -f content="$marker" -f branch=main >/dev/null
              dispatched=1
              break
            fi
            if [[ "$i" == 12 ]]; then
              # GitHub CLI error text contains API diagnostics only; redact the
              # controller token and bound the output. Never print inputs,
              # source contents, private logs, or clone credentials.
              dispatch_error="${dispatch_error//"$GH_TOKEN"/[redacted]}"
              diagnostic="$(printf '%s' "$dispatch_error" | tr '\r\n' ' ' | cut -c1-500)"
              echo "FMRL dispatch failed after 12 attempts: ${diagnostic:-no GitHub API diagnostic returned}" | tee -a "$GITHUB_STEP_SUMMARY" >&2
              exit 1
            fi
            sleep 5
          done
          [[ "$dispatched" == 1 ]] || { echo "FMRL dispatch did not start" >&2; exit 1; }
          completed=0
          for i in $(seq 1 55); do
            response="$(curl -fsS --connect-timeout 10 --max-time 20 \
              "https://api.github.com/repos/$BRIDGE/actions/workflows/atax-private-ci.yml/runs?per_page=5" 2>/dev/null || true)"
            result="$(printf '%s' "$response" | jq -r '.workflow_runs[0] | [.id,.status,.conclusion,.html_url] | @tsv' 2>/dev/null || true)"
            if [[ -n "$result" && "$result" != null ]]; then
              IFS=$'\t' read -r run_id status conclusion url <<< "$result"
              if [[ "$status" == completed ]]; then
                completed=1
                echo "FMRL run: $url; conclusion: $conclusion" >> "$GITHUB_STEP_SUMMARY"
                # Preserve failure step names before the disposable repository is deleted.
                # Do not retain private-source artifacts or raw logs.
                jobs="$(curl -fsS --connect-timeout 10 --max-time 20 \
                  "https://api.github.com/repos/$BRIDGE/actions/runs/$run_id/jobs?per_page=100" 2>/dev/null || true)"
                failure_details="$(printf '%s' "$jobs" | jq -r '.jobs[]? | "Job: " + .name + " (" + (.conclusion // .status) + ")", (.steps[]? | select(.conclusion == "failure") | "Failed step: " + .name)' 2>/dev/null || true)"
                if [[ -n "$failure_details" ]]; then
                  # Print only job and failed-step names. Do not persist raw
                  # private-source logs or upload any source-bearing artifacts.
                  printf '%s\n' "$failure_details" | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  echo "FMRL job-step detail unavailable." | tee -a "$GITHUB_STEP_SUMMARY"
                fi
                # Runner-local nested output is classified before any public logging.
                # Retain only our own fixed-prefix safe summaries from the disposable
                # job log; never echo or archive raw private-target output.
                if [[ "$conclusion" != success ]]; then
                  first_job="$(printf '%s' "$jobs" | jq -r '.jobs[0].id // empty' 2>/dev/null || true)"
                  if [[ "$first_job" =~ ^[0-9]+$ ]]; then
                    safe_log="$(mktemp)"
                    # Check only the static FMRL sanitizer receipts. Token scopes
                    # differ: the repository Contents token can lack Actions:read
                    # even when it was authorized to provision a disposable repo.
                    # None of the credentials are passed to private target scripts.
                    for attempt in $(seq 1 15); do
                      for reader_token in "$FMRL_LOGS_TOKEN" "$GH_TOKEN" "$FMRL_CONTENTS_TOKEN"; do
                        [[ -n "$reader_token" ]] || continue
                        if curl -fsSL --connect-timeout 10 --max-time 25 \
                          -H "Authorization: Bearer $reader_token" \
                          -H "Accept: application/vnd.github+json" \
                          "https://api.github.com/repos/$BRIDGE/actions/jobs/$first_job/logs" \
                          -o "$safe_log" 2>/dev/null; then
                          # Only exact, allowlisted sanitizer prefixes are eligible.
                          # Raw logs remain transient and are deleted below.
                          summary="$(sed -E 's/^[^ ]*Z //' "$safe_log" \
                            | grep -E '^(FMRL coverage:|FMRL direct suite:|FMRL failure categories:|FMRL failing gate:|FMRL TypeScript codes:|FMRL Skipo rule IDs:|FMRL Skipo migration categories:|FMRL dependency migration categories:|FMRL lockfile parse cause:|FMRL Frnes diagnostic state:|FMRL Frnes verifier JSON:|FMRL Frnes exception class:|FMRL last observed nested script:|Nested failure categories:|Safe error identifiers:)' \
                            | tail -n 16 || true)"
                          if [[ -n "$summary" ]]; then
                            printf '%s\n' "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
                            break 2
                          fi
                        fi
                      done
                      sleep 4
                    done
                    if [[ -z "${summary:-}" ]]; then
                      echo "FMRL failure receipts unavailable; job-step name remains authoritative." >> "$GITHUB_STEP_SUMMARY"
                    fi
                    rm -f "$safe_log"
                  fi
                fi
                [[ "$conclusion" == success ]] || exit 1
                break
              fi
            fi
            sleep 50
          done
          [[ "$completed" == 1 ]] || { echo "FMRL verification timed out" >&2; exit 1; }

      - name: ALWAYS delete FMRL and verify absence
        if: always() && steps.bridge.outputs.repository != ''
        env:
          GITHUB_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          GITHUB_INDEPENDENT_READ_TOKEN: ${{ secrets.FMRL_SECRETS_TOKEN }}
          BRIDGE: ${{ steps.bridge.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BRIDGE" =~ ^[A-Za-z0-9_.-]+/FMRL-[A-Za-z0-9-]+$ ]]
          [[ "$BRIDGE" != dinilmusick/ATAX ]]
          python3 tools/github/repository_lifecycle.py delete --repository "$BRIDGE"
          echo "FMRL cleanup independently verified." >> "$GITHUB_STEP_SUMMARY"
