name: Private Repository CI Fallback

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Private GitHub repository owner/name"
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA; blank uses the repository default branch"
        required: false
        default: ""
        type: string
      event:
        description: "act event used to execute target workflows"
        required: false
        default: push
        type: string
      workflow:
        description: "Optional workflow filename under .github/workflows/"
        required: false
        default: ""
        type: string

  push:
    paths:
      - ".agent/ci-request.json"

permissions:
  contents: read

jobs:
  run-private-repo-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_ROOT: ${{ github.workspace }}/.private-ci/${{ github.run_id }}-${{ github.run_attempt }}
      CLONE_ROOT: ${{ github.workspace }}/.private-ci/${{ github.run_id }}-${{ github.run_attempt }}/clones
      ARTIFACT_ROOT: ${{ github.workspace }}/.private-ci/${{ github.run_id }}-${{ github.run_attempt }}/artifacts
      CI_REQUEST_FILE: .agent/ci-request.json
      ATAX_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout ATAX
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve this run's request
        shell: bash
        env:
          CI_TRIGGER: ${{ github.event_name }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_EVENT: ${{ inputs.event }}
          INPUT_WORKFLOW: ${{ inputs.workflow }}
        run: bash tools/private-repo-ci/resolve-request.sh

      - name: Create isolated run directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CLONE_ROOT" "$ARTIFACT_ROOT"
          {
            echo "ATAX private CI run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Request: $TARGET_REPOSITORY @ ${TARGET_REF:-default branch}"
            echo "Trigger: $CI_TRIGGER"
            echo "Token policy: clone-only"
            echo "Run root: $RUN_ROOT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install act
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 240 https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz -o "$RUN_ROOT/act.tar.gz"
          echo "0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0  $RUN_ROOT/act.tar.gz" | sha256sum -c -
          tar -xzf "$RUN_ROOT/act.tar.gz" -C "$RUN_ROOT" act
          sudo install -m 0755 "$RUN_ROOT/act" /usr/local/bin/act
          act --version

      - name: Clone private repository (token available only in this step)
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash tools/private-repo-ci/clone-private-repo.sh

      - name: Validate target workflows
        shell: bash
        run: bash tools/private-repo-ci/validate-workflows.sh

      - name: Execute target workflows without repository credentials
        shell: bash
        run: bash tools/private-repo-ci/run-workflows.sh

      - name: Cleanup private clone and verify empty clone root
        if: always()
        shell: bash
        run: bash tools/private-repo-ci/cleanup-clone.sh

      - name: Record run and cleanup evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Private CI evidence"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Target: ${TARGET_REPOSITORY:-unresolved}"
            echo "- Ref: ${TARGET_REF:-default branch}"
            echo "- Workflow selection: ${CI_WORKFLOW:-all workflows}"
            echo "- Token mode: clone-only"
            if [[ -d "$CLONE_ROOT" ]] && [[ -z "$(find "$CLONE_ROOT" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
              echo "- Clone cleanup: verified empty"
            else
              echo "- Clone cleanup: FAILED"
              exit 1
            fi
            echo "- Private source artifacts: none uploaded by ATAX"
            echo "- Run-specific artifact directory: $ARTIFACT_ROOT (not uploaded)"
          } >> "$GITHUB_STEP_SUMMARY"
