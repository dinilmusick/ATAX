name: Owner-authorized private verification request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  resolve:
    if: >-
      github.event.issue.user.id == 155351357 &&
      github.event.issue.title == '[atax-fmrl] verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.lookup.outputs.repository }}
      ref: ${{ steps.lookup.outputs.ref }}
    steps:
      - name: Resolve private pull request without publishing target metadata
        id: lookup
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OPAQUE_PR_ID: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'Private read-only token unavailable'; exit 1; }
          pr_id="$(printf '%s' "$OPAQUE_PR_ID" | tr -d '\r\n[:space:]')"
          [[ "$pr_id" =~ ^PR_[A-Za-z0-9_-]{8,90}$ ]] || { echo 'Invalid opaque pull request id'; exit 1; }
          # The read-only fine-grained credential does not authorize GraphQL
          # node lookup. Resolve only across its authorized private repos via
          # REST without putting repository names or source SHA in public logs.
          candidates="$(mktemp)"
          trap 'rm -f "$candidates"' EXIT
          if ! gh api --paginate \
            '/user/repos?affiliation=owner&visibility=private&per_page=100' \
            --jq '.[].full_name' > "$candidates"; then
            echo 'Private REST repository enumeration unavailable' >&2
            exit 1
          fi
          name=""
          sha=""
          while IFS= read -r repo; do
            [[ "$repo" =~ ^dinilmusick/[A-Za-z0-9_.-]+$ ]] || continue
            match="$(gh api --paginate \
              "repos/$repo/pulls?state=open&per_page=100" 2>/dev/null \
              | jq -sr --arg requested "$pr_id" '
                map(.[] | select(.node_id == $requested and .state == "open"))
                | .[0].head.sha // empty
              ' || true)"
            if [[ "$match" =~ ^[0-9a-f]{40}$ ]]; then
              name="$repo"
              sha="$match"
              break
            fi
          done < "$candidates"
          [[ "$name" =~ ^dinilmusick/[A-Za-z0-9_.-]+$ ]] || {
            echo 'The opaque PR is not accessible through approved private REST scope' >&2
            exit 1
          }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'repository=%s\nref=%s\n' "$name" "$sha" >> "$GITHUB_OUTPUT"
          echo 'Resolved exact private PR head using authorized owner and clone-only credential.' >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: resolve
    uses: ./.github/workflows/private-repo-ci.yml
    with:
      repository: ${{ needs.resolve.outputs.repository }}
      ref: ${{ needs.resolve.outputs.ref }}
      event: push
      workflow: ""
    secrets: inherit

  report:
    if: always() && needs.resolve.result != 'skipped'
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Report only safe verification outcome
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ github.event.issue.number }}
          RESOLVE: ${{ needs.resolve.result }}
          VERIFY: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'ATAX FMRL private verification: resolve=%s, verify=%s.\n' "$RESOLVE" "$VERIFY" > /tmp/report.txt
          printf 'Controller evidence: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/report.txt
          printf 'Private source was not committed into the ATAX repository or disposable bridge.\n' >> /tmp/report.txt
          gh issue comment "$REQUEST" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.txt
