name: Legacy Armada Snapshot Sync (retired)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent incompatible rsync snapshot sync
        run: |
          echo "::warning::Legacy rsync sync is retired: it did not preserve Git subtree provenance."
          echo "Use .github/workflows/armada-subtree-sync.yml for PR-only bidirectional reconciliation."
