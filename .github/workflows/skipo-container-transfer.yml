name: Stage Skipo and app checkouts for container development
on:
  push:
    branches: [ops/skipo-downstream-migration-20261117]
    paths: [.github/workflows/skipo-container-transfer.yml]
permissions:
  contents: read
jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=atax-container-transfer -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
  snapshot:
    strategy:
      fail-fast: false
      matrix:
        repository: [Skipo, Aiko, Srkl-Engine, Kone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dinilmusick/${{ matrix.repository }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Encrypt the tracked checkout for the development container
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/recipient.pem" <<'CERT'
