title = "Agent Workspace secret scanning configuration"

[extend]
useDefault = true

# Narrow false-positive allowlists. Every exception requires an exact path
# and an exact deterministic fixture token.

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "SQL receipt_r2_key identifier comparison"
  condition = "AND"
  regexTarget = "match"
  paths = ['''upstream/forge/migrations/core/0017_architecture_reset\.sql$''']
  regexes = ['''(?:staged\.receipt_r2_key\s*=\s*legacy\.deletion_receipt_r2_key|legacy\.deletion_receipt_r2_key\s*=\s*staged\.receipt_r2_key)''']

  [[rules.allowlists]]
  description = "Prompt-attempts test HMAC fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''upstream/forge/worker/prompt-attempts\.test\.ts$''']
  regexes = ['''test-submission-attempt-secret-at-least-32-bytes''']

  [[rules.allowlists]]
  description = "Public GitHub OAuth client identifier"
  condition = "AND"
  regexTarget = "match"
  paths = ['''upstream/forge/wrangler\.quick-production\.jsonc$''']
  regexes = ['''Ov23limRaIiQdRQ3xoyd''']

  [[rules.allowlists]]
  description = "GitHub provider deterministic test fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''server/vaultAndAuth\.test\.ts$''']
  regexes = ['''ghp_1234567890abcdef123456''']

  [[rules.allowlists]]
  description = "Synthetic Supabase vault test fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''server/vaultAndAuth\.test\.ts$''']
  regexes = ['''sb_secret_test_key_0123456789abcdef''']

  [[rules.allowlists]]
  description = "Synthetic Supabase vault error-scrubbing fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''server/vaultAndAuth\.test\.ts$''']
  regexes = ['''sb_secret_leaky_key_0123456789abcdef''']

  [[rules.allowlists]]
  description = "ATAX Data API deterministic challenger token"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-challenger\.test\.mjs$''']
  regexes = ['''atax_0123456789abcdef0123456789abcdef0123456789abcdef''']

  [[rules.allowlists]]
  description = "ATAX M1 concurrency deterministic fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tests/m1-challenger-concurrency\.test\.mjs$''']
  regexes = ['''atax_5426bb43a95f34297740e50804035fc67db24be2be32098d''']

  [[rules.allowlists]]
  description = "ATAX E2E deterministic operator token"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tests/e2e-data-api/mock-server\.mjs$''']
  regexes = ['''atax_5426bb43a95f34297740e50804035fc67db24be2be32098d''']

  [[rules.allowlists]]
  description = "ATAX worker dashboard deterministic fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''worker-dashboard\.test\.ts$''']
  regexes = ['''atax-worker-test-secret-0123456789abcdef''']

  [[rules.allowlists]]
  description = "ATAX settings control-plane deterministic fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''server/settingsControlPlane\.test\.ts$''']
  regexes = ['''atax-settings-control-test-secret-0123456789abcdef''']

  [[rules.allowlists]]
  description = "ATAX instance-auth RPC identifier"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-ledger\.mjs$''']
  regexes = ['''atax_mcp_instance_auth_status_v1''']

  [[rules.allowlists]]
  description = "ATAX synthetic secret fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-ledger\.mjs$''']
  regexes = ['''atax_0123456789abcdef0123456789abcdef0123456789abcdef''']

[[rules]]
id = "jwt"

  [[rules.allowlists]]
  description = "ATAX Data API ledger deterministic JWT fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-ledger\.test\.mjs$''']
  regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSJ9\.mocksecretkeylongerthan20chars''']

  [[rules.allowlists]]
  description = "ATAX Data API ledger synthetic secret fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-ledger\.test\.mjs$''']
  regexes = ['''my-synthetic-secret-key-12345''']
