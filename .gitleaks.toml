title = "Agent Workspace secret scanning configuration"

[extend]
useDefault = true

# Narrow false-positive allowlists. Every exception requires an exact path
# and an exact deterministic fixture token.

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "SQL receipt_r2_key column equality is an identifier comparison, not a credential"
  condition = "AND"
  regexTarget = "match"
  paths = ['''upstream/forge/migrations/core/0017_architecture_reset\.sql$''']
  regexes = ['''(?:staged\.receipt_r2_key\s*=\s*legacy\.deletion_receipt_r2_key|legacy\.deletion_receipt_r2_key\s*=\s*staged\.receipt_r2_key)''']

  [[rules.allowlists]]
  description = "Prompt-attempts fixture uses a test-only HMAC placeholder"
  condition = "AND"
  regexTarget = "match"
  paths = ['''upstream/forge/worker/prompt-attempts\.test\.ts$''']
  regexes = ['''test-submission-attempt-secret-at-least-32-bytes''']

  [[rules.allowlists]]
  description = "Cloudflare GITHUB_OAUTH_CLIENT_ID is a public OAuth client identifier"
  condition = "AND"
  regexTarget = "match"
  paths = ['''upstream/forge/wrangler\.quick-production\.jsonc$''']
  regexes = ['''Ov23limRaIiQdRQ3xoyd''']

  [[rules.allowlists]]
  description = "GitHub provider validation test uses a deterministic non-secret fixture token"
  condition = "AND"
  regexTarget = "match"
  paths = ['''server/vaultAndAuth\.test\.ts$''']
  regexes = ['''ghp_1234567890abcdef123456''']

  [[rules.allowlists]]
  description = "ATAX vault test uses deterministic synthetic Supabase secret fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''server/vaultAndAuth\.test\.ts$''']
  regexes = ['''sb_secret_test_key_0123456789abcdef''']

  [[rules.allowlists]]
  description = "ATAX vault error-scrubbing test uses deterministic synthetic Supabase secret fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''server/vaultAndAuth\.test\.ts$''']
  regexes = ['''sb_secret_leaky_key_0123456789abcdef''']

  [[rules.allowlists]]
  description = "ATAX Data API challenger uses a deterministic test-only token"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-challenger\.test\.mjs$''']
  regexes = ['''atax_0123456789abcdef0123456789abcdef0123456789abcdef''']

  [[rules.allowlists]]
  description = "ATAX M1 concurrency harness uses deterministic test-only credentials"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tests/m1-challenger-concurrency\.test\.mjs$''']
  regexes = ['''atax_5426bb43a95f34297740e50804035fc67db24be2be32098d''']

  [[rules.allowlists]]
  description = "ATAX E2E mock server uses deterministic test-only operator token"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tests/e2e-data-api/mock-server\.mjs$''']
  regexes = ['''atax_5426bb43a95f34297740e50804035fc67db24be2be32098d''']

  [[rules.allowlists]]
  description = "ATAX Data API ledger tests use deterministic test-only JWT fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-ledger\.test\.mjs$''']
  regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSJ9\.mocksecretkeylongerthan20chars''']

  [[rules.allowlists]]
  description = "ATAX Data API ledger tests use deterministic synthetic secret fixture"
  condition = "AND"
  regexTarget = "match"
  paths = ['''tools/atax-mcp/data-api-ledger\.test\.mjs$''']
  regexes = ['''my-synthetic-secret-key-12345''']
