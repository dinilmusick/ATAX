name = "atax-mcp"
main = "worker.mjs"
compatibility_date = "2026-11-20"
workers_dev = true

# Supabase remains canonical; this Worker only handles incoming MCP HTTP requests.
# Define every credential with `wrangler secret put`, NEVER in this file.
# Invite registry and encrypted per-user connections (separate from canonical Supabase).
[[d1_databases]]
binding = "ATAX_TENANTS"
database_name = "atax-mcp-tenants"
database_id = "4035dd75-8fed-4c08-ac6a-a8b10c09417b"

[vars]
# Hosted mode refuses every caller without signed per-subject OAuth/JWT and a D1 invite.
MCP_MULTI_TENANT_ENABLED = "true"
# Owner-managed, per-subject high-entropy access keys let invitees connect without OIDC.
# OAuth/RS256 JWT remains supported when separately configured.
MCP_INVITATIONS_ENABLED = "true"
# Deliberately no owner Supabase URL or GitHub owner fallback in hosted mode.
# Each authenticated developer registers their own connections through /setup.
