name = "atax"
main = "worker.mjs"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Runtime secrets (ATAX_SUPABASE_URL and ATAX_SUPABASE_SECRET_KEY) are set via `wrangler secret put`. Never in [vars].
