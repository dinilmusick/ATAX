name = "atax-mcp"
main = "worker.mjs"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The ONLY MCP runtime environment binding is the confidential server secret:
# ATAX_SUPABASE_CONNECTION_URL=postgresql://<role>:<password>@<supabase-host>:5432/<db>?sslmode=require
# Set it with wrangler secret put ATAX_SUPABASE_CONNECTION_URL; no [vars].
# Owner policy, provider Vault credentials and Socket settings come from ledger.
