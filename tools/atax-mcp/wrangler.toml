name = "atax-mcp"
main = "worker.mjs"
compatibility_date = "2026-11-20"
workers_dev = true

# No operator GitHub/Supabase credentials, Luth issuer or encryption key.
# Client OAuth access/refresh tokens provide per-tenant envelope key material.
# D1 stores only hashed tokens and individually encrypted credential envelopes.
[[d1_databases]]
binding = "ATAX_TENANTS"
database_name = "atax-mcp-tenants"
database_id = "4035dd75-8fed-4c08-ac6a-a8b10c09417b"

[vars]
ATAX_BYOC_MODE = "true"
