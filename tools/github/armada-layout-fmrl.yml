name: FMRL Private Armada Layout Migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout trusted public migration tooling only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Clone private sources into transient runner
        env:
          CLONE_TOKEN: ${{ secrets.CLONE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLONE_TOKEN"
          root="$RUNNER_TEMP/armada-layout"
          mkdir -p "$root"
          auth="$(printf 'x-access-token:%s' "$CLONE_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --quiet --no-tags --single-branch https://github.com/dinilmusick/ULTRST-Armada.git "$root/armada"
          names=(GutTS KrnlTS FrnlTS Kloks Floks Skipo GutWP KrnlWP FrnlWP KloksWP FloksWP SkipoWP)
          for name in "${names[@]}"; do
            git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --quiet --no-tags --single-branch --depth 1 "https://github.com/dinilmusick/$name.git" "$root/source-$name"
          done
          unset auth CLONE_TOKEN
      - name: Validate snapshots and build migrated source tree without credentials
        shell: bash
        run: bash tools/github/armada-layout-migrate.sh
      - name: Push review branch and create pull request
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUSH_TOKEN"
          repo="$RUNNER_TEMP/armada-layout/armada"
          branch="layout/stack-folders-$GITHUB_RUN_ID"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          original="$(git -C "$repo" rev-parse origin/main)"
          current="$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote https://github.com/dinilmusick/ULTRST-Armada.git refs/heads/main | cut -f1)"
          test "$original" = "$current" || { echo 'Main advanced during migration; refusing stale push'; exit 1; }
          git -C "$repo" -c "http.extraheader=AUTHORIZATION: basic $auth" push --quiet origin "HEAD:refs/heads/$branch"
          GH_TOKEN="$PUSH_TOKEN" gh pr create --repo dinilmusick/ULTRST-Armada --base main --head "$branch" --title "refactor: group libraries by technology and move Skipo to framework" --body "Verified migration of six existing source subtrees into libraries/TypeScript-React and framework/Skipo, plus import of GutWP, KrnlWP, FrnlWP, KloksWP, FloksWP and framework/SkipoWP from their standalone repositories. No standalone default branches modified. Git subtree provenance is reestablished for the new prefixes. See the diff and verify before merging."
          unset auth PUSH_TOKEN
      - name: Delete all private checkout data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/armada-layout"
          test ! -e "$RUNNER_TEMP/armada-layout"
